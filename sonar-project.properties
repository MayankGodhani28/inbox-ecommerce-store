# SonarQube / SonarCloud Project Configuration
sonar.projectKey=inbox-ecommerce-store
sonar.projectName=inbox-ecommerce-store
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=src,server
sonar.tests=src/tests
sonar.test.inclusions=src/tests/**/*.test.ts,src/tests/**/*.test.tsx,src/tests/**/*.spec.ts

# Encodings
sonar.sourceEncoding=UTF-8

# Exclusions (exclude bundler outputs, dependencies, reports, and data files)
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  build/**,\
  coverage/**,\
  test-results/**,\
  playwright-report/**,\
  tmp/**,\
  load-tests/**,\
  output/**,\
  .agents/**,\
  .vercel/**,\
  **/*.json

# Coverage report location (generated via `npm run test:all -- --coverage`)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
