# ─────────────────────────────────────────────────────────────────
#  LOAD TEST 3: Spike Test (Flash Sale / Diwali Sale Simulation)
#  File: load-tests/03-spike-test.yml
#
#  Simulates: A sudden massive traffic spike — like when you post
#  a discount on Instagram/WhatsApp and everyone clicks at once.
#
#  Pattern:
#   - Normal: 20 users/second  (quiet before sale)
#   - SPIKE:  500 users/second (sale goes live — everyone rushes)
#   - Drop:   20 users/second  (most users got what they wanted)
#
#  Goal: Does the server survive sudden spikes?
#        Does it recover after the spike?
# ─────────────────────────────────────────────────────────────────

config:
  target: "http://localhost:4000"
  phases:
    # Normal traffic before the sale
    - name: "Pre-Sale (Quiet)"
      duration: 30
      arrivalRate: 20

    # ⚡ THE SPIKE — sale goes live!
    - name: "⚡ SPIKE — Flash Sale Begins!"
      duration: 20
      arrivalRate: 500       # 500 users/second SUDDENLY

    # Traffic comes back down
    - name: "Post-Spike Recovery"
      duration: 30
      arrivalRate: 20

  http:
    timeout: 20              # longer timeout during spikes

scenarios:
  # Everyone is hitting products and adding to cart
  - name: "Flash Sale Rush — Browse + Add to Cart"
    weight: 70
    flow:
      - get:
          url: "/api/products?dealOfDay=true"
      - get:
          url: "/api/products?bestSeller=true&pageSize=20"
      - get:
          url: "/api/coupons"

  # Some users checking their existing orders
  - name: "Order Status Check"
    weight: 20
    flow:
      - get:
          url: "/api/products?category=Electronics&sort=price-asc"

  # Login attempts
  - name: "Login during spike"
    weight: 10
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "spike-test@inbox.com"
            password: "spiketest123"
