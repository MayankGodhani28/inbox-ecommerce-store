# ─────────────────────────────────────────────────────────────────
#  LOAD TEST 1: Normal Load (Daily Traffic Simulation)
#  File: load-tests/01-normal-load.yml
#
#  Simulates: A regular busy day on inBox
#   - Users browsing products
#   - Some users logging in
#   - Some adding items to cart
#   - Checking order status
#
#  Target: 50 users/second for 1 minute
#  Expected: Server handles it without errors
# ─────────────────────────────────────────────────────────────────

config:
  target: "http://localhost:4000"
  phases:
    # Warm up: slowly increase users (like morning traffic)
    - name: "Warm Up"
      duration: 20
      arrivalRate: 5        # 5 new users/second
      rampTo: 20            # grow to 20 users/second

    # Normal load: steady traffic (afternoon peak)
    - name: "Normal Load"
      duration: 60
      arrivalRate: 50       # 50 new users/second

    # Cool down: traffic drops off (evening)
    - name: "Cool Down"
      duration: 20
      arrivalRate: 50
      rampTo: 5             # drop back to 5 users/second

  # What counts as a "pass" or "fail"
  ensure:
    thresholds:
      - http.response_time.p95: 1000   # 95% of requests under 1 second
      - http.response_time.p99: 3000   # 99% of requests under 3 seconds
    conditions:
      - expression: http.request_rate > 10   # at least 10 req/sec
        strict: true
      - expression: errors.rate < 1          # less than 1% errors
        strict: true

  # HTTP defaults
  http:
    timeout: 10             # requests that take >10s are considered failed
    defaults:
      headers:
        X-Requested-With: XMLHttpRequest
        Content-Type: "application/json"
        Accept: "application/json"

# ── What each virtual user does ──
scenarios:
  # 50% of users just browse products (anonymous/guest)
  - name: "Guest Product Browsing"
    weight: 50
    flow:
      - get:
          url: "/api/products"
          expect:
            - statusCode: 200
      - think: 2            # user spends 2 seconds looking at the list

      - get:
          url: "/api/products?category=Electronics&sort=popularity"
          expect:
            - statusCode: 200
      - think: 1

      - get:
          url: "/api/products?trending=true&pageSize=12"
          expect:
            - statusCode: 200
      - think: 3

  # 20% of users check health / static data
  - name: "Health Check"
    weight: 20
    flow:
      - get:
          url: "/api/health"
          expect:
            - statusCode: 200

      - get:
          url: "/api/products?category=Fashion"
          expect:
            - statusCode: 200

  # 20% search for specific products
  - name: "Product Search"
    weight: 20
    flow:
      - get:
          url: "/api/products?search=headphones"
          expect:
            - statusCode: 200
      - think: 2

      - get:
          url: "/api/products?search=shoes&minPrice=500&maxPrice=5000"
          expect:
            - statusCode: 200
      - think: 1

  # 10% users login and browse their cart
  - name: "Logged-in User - Check Cart"
    weight: 10
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "test@inbox.com"
            password: "testpassword123"
          capture:
            - json: "$.data.user.id"
              as: "userId"
      - think: 1

      - get:
          url: "/api/cart"
          expect:
            - statusCode: [200, 401]   # 401 is ok if no session cookie
