# ─────────────────────────────────────────────────────────────────
#  LOAD TEST 2: Stress Test (Find The Breaking Point)
#  File: load-tests/02-stress-test.yml
#
#  Simulates: Increasing traffic until the server FAILS
#   - Starts at 10 users/second
#   - Climbs to 200 users/second over 5 minutes
#   - Watches when errors start appearing
#
#  Goal: Find your server's MAXIMUM capacity
#  Question: "At exactly how many users/second does my server break?"
# ─────────────────────────────────────────────────────────────────

config:
  target: "http://localhost:4000"
  phases:
    - name: "Phase 1 — Low (10 req/s)"
      duration: 30
      arrivalRate: 10

    - name: "Phase 2 — Medium (30 req/s)"
      duration: 30
      arrivalRate: 30

    - name: "Phase 3 — High (60 req/s)"
      duration: 30
      arrivalRate: 60

    - name: "Phase 4 — Very High (100 req/s)"
      duration: 30
      arrivalRate: 100

    - name: "Phase 5 — Extreme (150 req/s)"
      duration: 30
      arrivalRate: 150

    - name: "Phase 6 — Breaking Point (200 req/s)"
      duration: 30
      arrivalRate: 200

  http:
    timeout: 15
    defaults:
      headers:
        Content-Type: "application/json"

scenarios:
  # Mix of different API endpoints — like real traffic
  - name: "Mixed API Load"
    weight: 60
    flow:
      - get:
          url: "/api/products"
      - get:
          url: "/api/products?category=Electronics"
      - get:
          url: "/api/products?trending=true"

  - name: "Search Heavy"
    weight: 30
    flow:
      - get:
          url: "/api/products?search=phone"
      - get:
          url: "/api/products?search=laptop&sort=price-asc"

  - name: "Auth Endpoints"
    weight: 10
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "nonexistent@test.com"
            password: "wrongpassword"
